                <div class="prose">
                    <p>如果可以的话，</p>
                    <p>我还是想要一间窗户朝西的屋子，和一只粘人的猫。</p>
                    <p>傍晚时躺在沙发上抱着猫，</p>
                    <p>伴随发动机般呼噜呼噜的呼吸，</p>
                    <p>看着夕阳把我们的影子慢慢拉长。</p>
                    <p>——度过又一个平常的一天。</p>
