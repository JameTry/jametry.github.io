                    <p>不再关心新闻事件，</p>
                    <p>不再关心房子汽车，</p>
                    <p>不再关心粮食水果。</p>
                    <p>不关心别人，也不关心自己。</p>
                    <br>
                    <p>躺在荒野草地中的床上，钻到被窝里。</p>
                    <p>但这次一反往日常态，</p>
                    <p>既没有星辰，也没有夕阳，</p>
                    <p>耳边只有微风吹拂杂草的沙沙声。</p>
                    <br>
                    <p>好安静啊。</p>
                    <p>你能听到我说话吗？</p>
