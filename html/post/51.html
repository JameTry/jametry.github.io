        <p>“……人死了变成鬼，那鬼死了呢？”</p>
        <p>“那就变成人了呀。”</p>
        <p>“喔我知道了，人死了变成鬼，鬼死了又变成人，人又变成鬼……”</p>
        <p>夜里街道上一个小女孩与妈妈的对话。</p>
        <br>
        <p>可死了就是死了，一种状态转变到另一种状态。</p>
        <p>你可以认为死亡有时是一种“美”。</p>
        <p>但不可避免，如果不及时火化，在你那看不见的思想外，却可以看到你腐烂生蛆的肉体。</p>
        <p>还是活着的好。</p>
        <br>
        <p>你有在商场快关门时待过吗？人群散去，耳边响起舒缓的音乐，明亮的灯光下只有琳琅满目的商品，一列又一列地排列在眼前。</p>
        <span class="time">2026年7月27日</span>
