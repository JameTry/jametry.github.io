                    <p>阳光挤进帘子</p>
                    <p>趴在窗口</p>
                    <p>像只安静的猫</p>
                    <p>动作轻柔</p>
                    <br>
                    <p>玻璃炫幻的光</p>
                    <p>跟随翠绿的刺槐树一起荡漾</p>
                    <p>淡淡的、</p>
                    <p>我仿佛闻到了阳光的清香</p>
